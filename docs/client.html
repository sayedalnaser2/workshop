<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Customer Order Page</title>
<style>
:root { --bg: #f4f5f7; --panel: #fff; --ink: #1d2330; --muted: #6b7385; --line: #e2e5ec; --brand: #1f3a5f; --brand2: #2f6fb0; --ok: #1f8a4c; --warn: #b7791f; }
@media (prefers-color-scheme: dark) { :root { --bg: #12161d; --panel: #1a2029; --ink: #e6e9ef; --muted: #98a1b3; --line: #2b3340; --brand: #7fb0ea; --brand2: #4d8fd6; --ok: #4cc380; --warn: #e0a84a; } }
* { box-sizing: border-box; } html, body { margin: 0; } body { font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Tahoma, "Noto Naskh Arabic", sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; }
main { max-width: 760px; margin: 0 auto; padding: 18px 16px 60px; }
.top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; } .top img { height: 46px; background: #fff; border-radius: 8px; padding: 2px; } .top b { font-size: 17px; } .grow { flex: 1; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(20,30,50,.05); } h1 { font-size: 22px; margin: 0 0 4px; } h2 { font-size: 16px; margin: 0 0 10px; } .muted { color: var(--muted); }
input { font: inherit; width: 100%; padding: 12px 13px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); } label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 10px; padding: 9px 14px; } button.primary { background: var(--brand2); border-color: var(--brand2); color: #fff; width: 100%; margin-top: 16px; padding: 12px; font-weight: 600; }
.err { color: #c0392b; min-height: 1.3em; margin: 10px 0 0; }
.bar { height: 16px; border-radius: 9px; background: var(--line); overflow: hidden; margin: 10px 0 4px; } .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--brand2), var(--ok)); border-radius: 9px; transition: width .6s; }
.pct { font-size: 40px; font-weight: 800; line-height: 1; } .stage { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); } .stage:first-of-type { border-top: 0; }
.dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; flex: none; background: var(--line); color: var(--muted); } .dot.done { background: var(--ok); color: #fff; } .dot.doing { background: var(--warn); color: #fff; }
.mini { height: 6px; border-radius: 4px; background: var(--line); overflow: hidden; margin-top: 5px; } .mini i { display: block; height: 100%; background: var(--brand2); }
.gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; } .gal figure { margin: 0; cursor: pointer; } .gal img { width: 100%; height: 130px; object-fit: cover; border-radius: 10px; display: block; background: var(--line); } .gal figcaption { font-size: 12px; color: var(--muted); padding: 3px 2px; }
.lb { position: fixed; inset: 0; background: rgba(0,0,0,.88); display: grid; place-items: center; z-index: 9; padding: 14px; } .lb img { max-width: 100%; max-height: 86vh; border-radius: 8px; } .lb button { position: absolute; top: 12px; right: 14px; }
.stage3d { position: relative; height: 380px; border-radius: 12px; overflow: hidden; background: #eef2f6; touch-action: none; } .stage3d canvas { width: 100%; height: 100%; display: block; cursor: grab; } .tools { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; } .tools button { padding: 7px 12px; font-size: 14px; }
.msg { background: color-mix(in srgb, var(--brand2) 10%, transparent); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; }
[dir=rtl] .gal figcaption { text-align: right; }

:root[data-theme="dark"] { --bg: #12161d; --panel: #1a2029; --ink: #e6e9ef; --muted: #98a1b3; --line: #2b3340; --brand: #7fb0ea; --brand2: #4d8fd6; --ok: #4cc380; --warn: #e0a84a; color-scheme: dark; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }
body { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { padding-left: 0; padding-right: 0; }
.pv { max-width: 760px; margin: 0 auto; padding: 12px 0 0; } .pv div { background: color-mix(in srgb, var(--warn) 14%, var(--panel)); border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--line)); border-radius: 12px; padding: 10px 14px; font-size: 14px; }
.pv b { font-variant-numeric: tabular-nums; }
</style></head><body>
<div class="pv"><div>Preview with sample data. To sign in use order <b>260001</b> and code <b>1234 5678</b>. This is the page your customers will open at client.yourdomain.com.</div></div>
