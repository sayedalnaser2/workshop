<title>Workshop Manager Demo</title>
<style>:root {
  --bg: #f4f5f7; --panel: #fff; --ink: #1d2330; --muted: #6b7385; --line: #e2e5ec; --brand: #1f3a5f; --brand-2: #2f6fb0;
  --ok: #1f8a4c; --warn: #b7791f; --bad: #c0392b; --soft: #eef2f8; --radius: 10px; --shadow: 0 1px 2px rgba(20, 30, 50, .06), 0 4px 14px rgba(20, 30, 50, .05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme=light]) { --bg: #12161d; --panel: #1a2029; --ink: #e6e9ef; --muted: #98a1b3; --line: #2b3340; --brand: #7fb0ea; --brand-2: #4d8fd6; --soft: #212a36; --ok: #4cc380; --warn: #e0a84a; --bad: #ef6a5b; --shadow: none; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
[hidden] { display: none !important; }
a { color: var(--brand-2); text-decoration: none; }
h1, h2, h3 { margin: 0; line-height: 1.2; }
.muted { color: var(--muted); }
.grow { flex: 1; }

/* layout */
#app { display: flex; min-height: 100vh; }
#side { width: 232px; background: var(--brand); color: #fff; padding: 14px 10px; position: sticky; top: 0; height: 100vh; overflow-y: auto; flex: none; }
.brand { display: flex; align-items: center; gap: 10px; color: #fff; padding: 6px 8px 14px; font-weight: 700; letter-spacing: .02em; }
.brand img { width: 38px; height: 38px; background: #fff; border-radius: 8px; padding: 2px; }
.brand small { font-weight: 400; opacity: .75; }
#nav a { display: flex; gap: 10px; align-items: center; color: rgba(255, 255, 255, .82); padding: 8px 10px; border-radius: 8px; margin: 1px 0; }
#nav a:hover { background: rgba(255, 255, 255, .1); color: #fff; }
#nav a.on { background: rgba(255, 255, 255, .18); color: #fff; font-weight: 600; }
.mebtn { display: flex; gap: 10px; align-items: center; width: 100%; margin-top: 14px; padding: 8px 10px; border: 0; border-top: 1px solid rgba(255, 255, 255, .15); background: none; color: #fff; cursor: pointer; text-align: left; font: inherit; border-radius: 0; }
.mebtn:hover { background: rgba(255, 255, 255, .08); }
.mebtn b, .mebtn small { display: block; line-height: 1.25; } .mebtn small { opacity: .65; font-size: 11px; }
#meAvatar { width: 30px; height: 30px; border-radius: 50%; background: rgba(255, 255, 255, .2); display: grid; place-items: center; font-weight: 700; flex: none; }
#nav .grp { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; opacity: .55; padding: 14px 10px 4px; }
.main-wrap { flex: 1; min-width: 0; }
.topbar { display: none; align-items: center; gap: 10px; padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; font-weight: 600; }
main { padding: 22px 26px 60px; max-width: 1500px; }
.ph { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.ph h1 { font-size: 22px; }
.ph .sub { color: var(--muted); }

/* cards / grids */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.card h3 { font-size: 14px; margin-bottom: 10px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
.stat .v { font-size: 24px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
.stat .v.pos { color: var(--ok); } .stat .v.neg { color: var(--bad); }
.cols2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; }
.cols3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }

/* buttons + inputs */
.btn { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 7px 13px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--soft); }
.btn.primary { background: var(--brand-2); border-color: var(--brand-2); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.sm { padding: 3px 9px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: default; }
button.icon { background: none; border: 0; font-size: 20px; cursor: pointer; color: inherit; padding: 2px 8px; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; width: 100%; }
input:focus, select:focus, textarea:focus { outline: 2px solid color-mix(in srgb, var(--brand-2) 40%, transparent); border-color: var(--brand-2); }
input[type=checkbox] { width: auto; }
.form { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 14px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field > span { font-size: 12px; color: var(--muted); font-weight: 600; }
.field small { color: var(--muted); }
.field.full { grid-column: 1 / -1; }
.field.check { flex-direction: row; align-items: center; gap: 8px; } .field.check > span { order: 2; font-size: 14px; color: var(--ink); font-weight: 400; }

/* tables */
.tbar { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
.tbar .search { max-width: 280px; }
.count { color: var(--muted); font-size: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); color: var(--ink); padding: 6px 12px; cursor: pointer; font: inherit; border-right: 1px solid var(--line); }
.seg button:last-child { border: 0; } .seg button.on { background: var(--brand-2); color: #fff; }
.twrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
table.grid { width: 100%; border-collapse: collapse; }
.grid th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding: 9px 10px; border-bottom: 1px solid var(--line); background: var(--soft); cursor: pointer; white-space: nowrap; position: sticky; top: 0; }
.grid th.asc::after { content: " ▲"; font-size: 9px; } .grid th.desc::after { content: " ▼"; font-size: 9px; }
.grid td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.grid tr:last-child td { border-bottom: 0; }
.grid tr.click { cursor: pointer; } .grid tr.click:hover td { background: var(--soft); }
.grid .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.grid td.act { text-align: right; white-space: nowrap; }
.grid tfoot td { font-weight: 700; background: var(--soft); border-top: 2px solid var(--line); }
.grid .empty { text-align: center; color: var(--muted); padding: 30px; }
.pager { display: flex; gap: 12px; align-items: center; justify-content: center; margin-top: 10px; color: var(--muted); }
.pos { color: var(--ok); } .neg { color: var(--bad); }
.badge { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 11px; font-weight: 600; background: var(--soft); color: var(--muted); }
.badge.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.badge.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.badge.bad { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
.badge.blue { background: color-mix(in srgb, var(--brand-2) 16%, transparent); color: var(--brand-2); }

/* modal + toast */
.overlay { position: fixed; inset: 0; background: rgba(10, 15, 25, .5); display: flex; align-items: flex-start; justify-content: center; padding: 5vh 14px; z-index: 50; overflow-y: auto; }
.modal { background: var(--panel); border-radius: 12px; width: min(560px, 100%); box-shadow: 0 20px 60px rgba(0, 0, 0, .3); }
.modal.wide { width: min(1000px, 100%); }
.modal header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.modal .mbody { padding: 18px; } .modal footer { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; }
#toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 99; }
.toast { background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 8px; box-shadow: var(--shadow); }
.toast.err { background: var(--bad); color: #fff; }

/* login */
.login { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
.login .card { width: min(380px, 100%); display: flex; flex-direction: column; gap: 12px; text-align: center; }
.login-logo { width: 220px; max-width: 100%; margin: 0 auto; background: #fff; border-radius: 8px; }
.err { color: var(--bad); min-height: 1.2em; margin: 0; }

/* quote editor */
.qhead { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.items-wrap { overflow-x: auto; }
table.items { width: 100%; border-collapse: collapse; min-width: 1120px; }
.items th { font-size: 11px; text-transform: uppercase; color: var(--muted); text-align: left; padding: 6px 4px; }
.items td { padding: 3px 3px; vertical-align: top; border-top: 1px solid var(--line); }
.items td input, .items td select, .items td textarea { padding: 5px 6px; }
.items .n { width: 28px; color: var(--muted); text-align: center; padding-top: 10px; }
.items .w-s { width: 70px; } .items .w-m { width: 90px; } .items .w-q { width: 62px; } .items .tot { text-align: right; font-weight: 600; padding-top: 9px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.items .sub textarea { min-height: 30px; resize: vertical; font-size: 12px; color: var(--muted); }
.items .cost { font-size: 11px; color: var(--muted); text-align: right; }
.items tr.manual input.price { border-color: var(--warn); }
.totals { margin-left: auto; width: min(380px, 100%); }
.totals .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 5px 0; }
.totals .row input { width: 110px; text-align: right; }
.totals .grand { font-size: 18px; font-weight: 800; border-top: 2px solid var(--ink); margin-top: 6px; padding-top: 8px; }
.words { color: var(--muted); font-style: italic; }
.sticky-actions { position: sticky; bottom: 0; background: var(--bg); padding: 10px 0; display: flex; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--line); margin-top: 14px; z-index: 3; }

/* models */
.mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.mcard { cursor: pointer; text-align: center; transition: transform .1s; } .mcard:hover { transform: translateY(-2px); }
.mcard svg { width: 100%; height: 150px; }
.mcard b { display: block; margin-top: 6px; }
.draw svg { max-width: 100%; }
.spec-sec { margin-top: 14px; } .spec-sec h4 { margin: 0 0 6px; font-size: 13px; }
table.mini { width: 100%; border-collapse: collapse; } .mini th { font-size: 11px; color: var(--muted); text-align: left; padding: 3px; text-transform: uppercase; }
.mini td { padding: 2px; } .mini input, .mini select { padding: 5px 6px; }
.bar { display: flex; height: 18px; border-radius: 4px; overflow: hidden; background: var(--soft); border: 1px solid var(--line); margin: 3px 0 6px; }
.bar i { display: block; height: 100%; border-right: 1px solid var(--panel); background: var(--brand-2); opacity: .85; }
.bar i:nth-child(3n) { background: #4aa086; } .bar i:nth-child(3n+1) { background: #c98a2b; }
.bar-label { font-size: 11px; color: var(--muted); }

/* charts */
.chart { width: 100%; height: 180px; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }

/* printable documents */
.doc { background: #fff; color: #111; width: 210mm; min-height: 297mm; margin: 0 auto; padding: 12mm 14mm; font-size: 12px; box-shadow: var(--shadow); position: relative; }
.doc .dh { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; }
.doc .dh img { height: 70px; } .doc .dh .co { text-align: right; font-size: 11px; line-height: 1.5; }
.doc h2 { text-align: center; letter-spacing: .25em; font-size: 20px; margin: 14px 0 10px; }
.doc .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 24px; margin-bottom: 10px; }
.doc .meta b { display: inline-block; min-width: 70px; }
.doc table { width: 100%; border-collapse: collapse; }
.doc th { background: #1f3a5f; color: #fff; padding: 5px 6px; font-size: 11px; text-align: left; }
.doc td { padding: 5px 6px; border-bottom: 1px solid #ddd; vertical-align: top; }
.doc td.n, .doc th.n { text-align: right; white-space: nowrap; }
.doc .note { color: #555; font-size: 11px; padding-left: 14px; }
.doc .tot { margin-left: auto; width: 250px; margin-top: 8px; }
.doc .tot div { display: flex; justify-content: space-between; padding: 3px 0; }
.doc .tot .g { font-weight: 800; font-size: 14px; border-top: 2px solid #111; margin-top: 4px; padding-top: 6px; }
.doc .sign { display: flex; justify-content: space-between; margin-top: 36px; }
.doc .sign div { width: 30%; border-top: 1px solid #111; padding-top: 4px; text-align: center; }
.doc .terms { margin-top: 18px; font-size: 11px; color: #333; }
.doc .foot { position: absolute; left: 14mm; right: 14mm; bottom: 8mm; text-align: center; font-size: 10px; border-top: 1px solid #aaa; padding-top: 4px; }
.doc .banner { text-align: center; font-weight: 700; margin: 8px 0 4px; }
.printbar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }

@media (max-width: 900px) {
  #side { position: fixed; left: -250px; z-index: 40; transition: left .2s; } #side.open { left: 0; }
  .topbar { display: flex; } main { padding: 14px 12px 60px; }
  .qhead, .cols2, .cols3, .form { grid-template-columns: 1fr; }
  .doc { width: 100%; padding: 8mm; min-height: 0; }
}
@media print {
  body { background: #fff; }
  #side, .topbar, .printbar, .sticky-actions, #toasts, .noprint { display: none !important; }
  #app, .main-wrap, main { display: block; padding: 0; margin: 0; max-width: none; }
  .doc { box-shadow: none; margin: 0; width: auto; min-height: 270mm; padding: 0; }
  .doc .foot { position: fixed; bottom: 0; left: 0; right: 0; }
  @page { size: A4; margin: 12mm; }
  .doc .items-print tr { break-inside: avoid; }
}
